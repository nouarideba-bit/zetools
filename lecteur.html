<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Lecteur vidéo ZETOOLS</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font: 15px system-ui, sans-serif; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  p { padding: 24px; text-align: center; }
</style>
</head>
<body>
<script>
  // Relais de lecture : YouTube exige une page d'origine identifiée (sinon « Erreur 153 »).
  // La maquette ouverte en fichier local n'en a pas ; elle charge donc la vidéo à travers cette page hébergée.
  (function () {
    var q = new URLSearchParams(location.search);
    var id = q.get('v') || '';
    if (!/^[A-Za-z0-9_-]{11}$/.test(id)) { document.body.innerHTML = '<p>Vidéo introuvable.</p>'; return; }
    var debut = parseInt(q.get('start'), 10);
    var src = 'https://www.youtube-nocookie.com/embed/' + id + '?rel=0&playsinline=1'
      + (q.get('auto') === '1' ? '&autoplay=1' : '') + (debut > 0 ? '&start=' + debut : '');
    var f = document.createElement('iframe');
    f.src = src; f.title = q.get('titre') || 'Vidéo';
    f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
    f.allowFullscreen = true; f.referrerPolicy = 'strict-origin-when-cross-origin';
    document.body.appendChild(f);
  })();
</script>
</body>
</html>
